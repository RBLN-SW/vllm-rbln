env:
  UV_CACHE_DIR: "/root/.cache/uv"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  # Only the cron schedule sets this, so a manual or re-run build exercises the
  # lanes without publishing. Declared here so build.env sees the name either way.
  NIGHTLY_DEPLOY: "${NIGHTLY_DEPLOY:-}"

_secrets: &secrets
  UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
  UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
  UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
  UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
  HF_TOKEN: FSW_HF_TOKEN
  HF_HOME: FSW_HF_HOME

_dshm: &dshm
  - kubernetes:
      podSpecPatch:
        containers:
          - name: container-0
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 4Gi

_sync: &sync "echo '--- :package: uv sync' && uv sync --locked --python 3.12 --extra test --extra dev --extra runtime"

_measured: &measured
  soft_fail: true
  agents:
    queue: udc
  image: "${DEVTOOLS_DOCKER_IMAGE}"
  secrets: *secrets
  plugins: *dshm
  command:
    - *sync

_perf:
  <<: *measured
  timeout_in_minutes: 180
  artifact_paths:
    - "perf-results/**/*"

_lm_eval:
  <<: *measured
  timeout_in_minutes: 120
  artifact_paths:
    - "lm-eval-results/**/*"

_examples: &examples
  agents:
    queue: udc
  resources:
    npu:
      count: 1
      product: "RBLN-CR13"
  image: "${DEVTOOLS_DOCKER_IMAGE}"
  secrets: *secrets
  plugins: *dshm
  timeout_in_minutes: 180
  artifact_paths:
    - "example-results/**/*"

steps:
  - label: ":sparkles: upload pytest"
    key: "nightly-pytest"
    checkout:
      sparse:
        paths:
          - .buildkite
    env:
      PYTEST_COMPILER_OVERRIDE_COMMAND: ""
      PYTEST_E2E_ARGS: "--num-hidden-layers 0 --maxfail=0"
      PYTEST_E2E_TIMEOUT: "120"
    command: "buildkite-agent pipeline upload .buildkite/pipelines/vllm-rbln/pipeline-pytest.yml --apply-if-changed=false"

  - group: "[CR13] examples (vllm)"
    key: "nightly-examples-vllm"
    steps:
      - <<: *examples
        label: "basic"
        key: "nightly-examples-vllm-basic"
        command:
          - *sync
          - "uv run --no-sync python .buildkite/pipelines/vllm-rbln/scripts/run_examples.py basic"

      - <<: *examples
        label: "features"
        key: "nightly-examples-vllm-features"
        resources:
          npu:
            count: 4
            product: "RBLN-CR13"
        command:
          - *sync
          - "uv run --no-sync python .buildkite/pipelines/vllm-rbln/scripts/run_examples.py features"

      - <<: *examples
        label: "specdec (NGRAM/EAGLE/EAGLE3/suffix)"
        key: "nightly-examples-vllm-specdec"
        command:
          - *sync
          - "uv run --no-sync python .buildkite/pipelines/vllm-rbln/scripts/run_examples.py specdec"

      - <<: *examples
        label: "specdec (MTP)"
        key: "nightly-examples-vllm-mtp"
        resources:
          npu:
            count: 8
            product: "RBLN-CR13"
        command:
          - *sync
          - "uv run --no-sync python .buildkite/pipelines/vllm-rbln/scripts/run_examples.py mtp"

      - <<: *examples
        label: "specdec (DFlash)"
        key: "nightly-examples-vllm-dflash"
        resources:
          npu:
            count: 4
            product: "RBLN-CR13"
        command:
          - *sync
          - "uv run --no-sync python .buildkite/pipelines/vllm-rbln/scripts/run_examples.py dflash"

      - <<: *examples
        label: "pooling"
        key: "nightly-examples-vllm-pooling"
        command:
          - *sync
          - "uv run --no-sync python .buildkite/pipelines/vllm-rbln/scripts/run_examples.py pooling"

  # Measured, not gated: soft_fail keeps the build green and no measured lane
  # appears in the deploy step's depends_on.

  - group: "[CR13] perf"
    key: "nightly-perf"
    steps:
      - label: ":sparkles: upload perf"
        key: "nightly-perf-upload"
        soft_fail: true
        image: "${DEVTOOLS_DOCKER_IMAGE}"
        command: |
          set -euo pipefail
          uv run --no-project --python 3.12 --with pyyaml python \
            .buildkite/pipelines/vllm-rbln/scripts/perf/run_perf.py pipeline --chip RBLN-CR13 \
            | buildkite-agent pipeline upload

  - group: "[CR13] lm-eval"
    key: "nightly-lm-eval"
    steps:
      - label: ":sparkles: upload lm-eval"
        key: "nightly-lm-eval-upload"
        soft_fail: true
        image: "${DEVTOOLS_DOCKER_IMAGE}"
        command: |
          set -euo pipefail
          uv run --no-project --python 3.12 --with pyyaml python \
            .buildkite/pipelines/vllm-rbln/scripts/lm-eval/run_lm_eval.py pipeline --chip RBLN-CR13 \
            | buildkite-agent pipeline upload

  # Depending on the upload also waits for every uploaded pytest job.
  # No NPU needed -- the wheel is a pure CPU build.
  - label: ":package: nightly publish"
    key: "nightly-publish"
    if: 'build.env("NIGHTLY_DEPLOY") == "1"'
    depends_on:
      - "nightly-pytest"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets:
      # rbln-nexus-nightly is a non-explicit index, so resolving the build
      # backend already needs its credentials.
      UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
      UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
      UV_PUBLISH_USERNAME: MGMT_NEXUS_USERNAME
      UV_PUBLISH_PASSWORD: MGMT_NEXUS_PASSWORD
    env:
      UV_PUBLISH_URL: "https://nexus.mgmt.rbln.in/repository/pypi-vllm-nightly/"
    timeout_in_minutes: 30
    command:
      - "bash .buildkite/pipelines/vllm-rbln/scripts/publish-nightly-wheel.sh"
