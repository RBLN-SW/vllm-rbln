# vllm-rbln PR pre-test gate (Obedients / Buildkite).
#
# The Obedients bootstrap step uploads THIS file. It runs the two cheap gates --
# the team-member policy check and pre-commit lint -- in parallel, and only if
# BOTH pass does it upload the heavy test pipeline (run-pytest.yml). So the NPU /
# pytest steps never start for an untrusted author or a lint failure.
#
# (Forked-PR builds are disabled on this pipeline, so uploading repo-defined
# steps is safe -- same-repo PRs are trusted. That setting is the real fork
# boundary; the team-member step is a policy narrowing to the sw/fsw teams.)
env:
  UV_CACHE_DIR: "/mnt/uv_cache"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"

# uv index creds for the pre-commit env (LHS = job env var, RHS = OB vault name).
_uv_secrets: &uv_secrets
  UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
  UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
  UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
  UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD

steps:
  - label: ":closed_lock_with_key: team-member gate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: &light-cpu
      cpu:
        requests: "2"
        limits: "2"
      memory:
        requests: "8Gi"
        limits: "8Gi"
    secrets:
      - GIT_PAT
    command:
      - "bash .buildkite/scripts/gate-team-member.sh"

  - label: ":mag: pre-commit"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *light-cpu
    secrets: *uv_secrets
    command:
      - "uv tool run pre-commit run --all-files --hook-stage manual --show-diff-on-failure"

  # Both gates must pass before the heavy test pipeline is even uploaded.
  - wait: ~

  - label: ":pipeline: vllm-rbln pytest"
    command: "buildkite-agent pipeline upload .buildkite/pipelines/pr/run-pytest.yml"
    plugins:
      - sparse-checkout#v1.6.0:
          paths:
            - .buildkite
