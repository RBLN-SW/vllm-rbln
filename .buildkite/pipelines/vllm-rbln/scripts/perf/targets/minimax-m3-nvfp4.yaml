chips: [RBLN-CR03, RBLN-CR13]
model: nvidia/MiniMax-M3-NVFP4

env:
  VLLM_DISABLE_COMPILE_CACHE: "1"

serve:
  model_impl: vllm
  max_model_len: 1048576
  block_size: 2048
  max_num_batched_tokens: 512
  max_num_seqs: 4
  enable_prefix_caching: false
  kv_cache_dtype: fp8
  limit_mm_per_prompt: '{"image": 1, "video": 0}'

# One server start -- and one compile -- per entry.
serve_params:
  tp4: {tensor_parallel_size: 4}
  pp4: {pipeline_parallel_size: 4}

bench:
  dataset_name: random
  backend: openai-chat
  endpoint: /v1/chat/completions
  random_range_ratio: 0
  ignore_eos: true
  seed: 0
  num_warmups: 4

bench_params:
  c4-in1k-out1k-greedy:
    serve: [tp4]
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 1024
    random_output_len: 1024
    temperature: 0.0

  c4-in1k-out1k-non-greedy:
    serve: [tp4]
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 1024
    random_output_len: 1024
  
  c4-in50k-out1-greedy:
    serve: [pp4]
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 51200
    random_output_len: 1
    temperature: 0.0
  
  c4-vlm-img672-in1k-out1k-greedy:
    serve: [tp4]
    dataset_name: random-mm
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 1024
    random_output_len: 1024
    temperature: 0.0
    random_mm_base_items_per_request: 1
    random_mm_num_mm_items_range_ratio: 0
    random_mm_limit_mm_per_prompt: '{"image": 1, "video": 0}'
    random_mm_bucket_config: '{(672, 672, 1): 1.0}'
  
  c4-vlm-img672-in50k-out1-greedy:
    serve: [pp4]
    dataset_name: random-mm
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 51200
    random_output_len: 1
    temperature: 0.0
    random_mm_base_items_per_request: 1
    random_mm_num_mm_items_range_ratio: 0
    random_mm_limit_mm_per_prompt: '{"image": 1, "video": 0}'
    random_mm_bucket_config: '{(672, 672, 1): 1.0}'

server_ready_timeout: 3600
num_runs: 1
