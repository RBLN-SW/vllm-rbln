chips: [RBLN-CR03, RBLN-CR13]
model: MiniMaxAI/MiniMax-M2.7

env:
  VLLM_DISABLE_COMPILE_CACHE: "1"
  VLLM_RBLN_USE_VLLM_MODEL: "1"
  VLLM_RBLN_BATCH_ATTN_OPT: "1"
  VLLM_RBLN_SORT_BATCH: "1"
  VLLM_RBLN_USE_W8A16: "1"

serve:
  max_model_len: 65536
  block_size: 4096
  max_num_batched_tokens: 512
  max_num_seqs: 4
  enable_expert_parallel: true
  enable_prefix_caching: false

# One server start -- and one compile -- per entry.
serve_params:
  tp4ep: {tensor_parallel_size: 4, num_gpu_blocks_override: 82}
  pp4ep: {pipeline_parallel_size: 4}
  dp4ep: {data_parallel_size: 4, max_num_seqs: 1}

bench:
  dataset_name: random
  random_range_ratio: 0
  ignore_eos: true
  seed: 0
  num_warmups: 4

bench_params:
  c4-in50k-out1k-greedy:
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 51200
    random_output_len: 1024
    temperature: 0.0

  c4-in50k-out1k-non-greedy:
    max_concurrency: 4
    num_prompts: 16
    random_input_len: 51200
    random_output_len: 1024

server_ready_timeout: 3600
num_runs: 1
