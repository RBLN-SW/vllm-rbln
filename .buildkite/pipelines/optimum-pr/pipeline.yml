# vllm-rbln optimum PR test suites, uploaded by .buildkite/pr.yml.

notify:
- github_commit_status:
    context: "[OB] vLLM-RBLN Optimum pytest"

env:
  UV_CACHE_DIR: "/mnt/uv_cache"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_PROJECT_ENVIRONMENT: "/mnt/cache/venv"
  VIRTUAL_ENV: "/mnt/cache/venv"
  NUM_INPUT_PROMPT: "1"
  VLLM_LOGGING_LEVEL: "DEBUG"

_secrets: &secrets
  UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: MGMT_NEXUS_USERNAME
  UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: MGMT_NEXUS_PASSWORD
  UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
  UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
  HF_TOKEN: HF_TOKEN
  HF_HOME: HF_HOME

# Run a step only when the PR touches a path that can affect the optimum path.
# Honored solely when the pipeline is uploaded with --git-diff-base (see
# .buildkite/pr.yml); without that flag every step runs, as it did before.
# The exclude list is deliberately conservative -- it drops only paths that are
# native-path-only, since over-including merely wastes a run while
# over-excluding would silently skip a suite that should have caught a break.
_if_changed: &if_changed
  include:
    - ".buildkite/**"
    - "tests/optimum/**"
    - "vllm_rbln/**"
    - "pyproject.toml"
    - "uv.lock"
  exclude:
    - ".buildkite/pipelines/vllm-rbln/**"
    - "tests/native/**"
    - "vllm_rbln/patches/**"
    - "vllm_rbln/compilation/**"
    - "vllm_rbln/v1/worker/rbln_*.py"
    - "vllm_rbln/v1/spec_decode/**"

_needs_venv: &needs_venv ["venv"]

steps:
  - label: ":package: shared venv"
    key: "venv"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets: *secrets
    command:
      - |
        echo '--- :package: uv sync'
        uv sync --locked --python 3.12 --extra test --extra dev --extra runtime --no-editable --compile-bytecode
        echo '--- :hammer: rebel-compiler-override'
        bash .buildkite/scripts/rebel-compiler-override.sh

  # ===========================================================================
  # CPU suites
  # ===========================================================================
  - label: ":pytest: tests/optimum/v1/core"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: &cpu-only-resources
      cpu:
        requests: "4"
        limits: "4"
      memory:
        requests: "32Gi"
        limits: "32Gi"
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/v1/core --durations 0"

  - label: ":pytest: tests/optimum/v1/distributed"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *cpu-only-resources
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/v1/distributed --durations 0"

  - label: ":pytest: tests/optimum/v1/worker"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *cpu-only-resources
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/v1/worker --durations 0"

  - label: ":pytest: tests/optimum/optimum_compile/converter"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *cpu-only-resources
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/optimum_compile/converter --durations 0"

  # ===========================================================================
  # NPU suites
  # ===========================================================================
  - label: ":pytest: tests/optimum/entrypoints/openai"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources:
      npu:
        count: 1
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/entrypoints/openai --durations 0 --timeout=600"

  - label: ":pytest: tests/optimum/entrypoints/llm"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources:
      npu:
        count: 1
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/entrypoints/llm --durations 0"

  - label: ":pytest: tests/optimum/v1/models"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources:
      npu:
        count: 1
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/v1/models --durations 0"

  - label: ":pytest: tests/optimum/v1/sample/test_sampler*.py"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources:
      npu:
        count: 8
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - 'uv run --no-sync pytest -x -vvs -n 8 -k "warm_up_true" tests/optimum/v1/sample/test_sampler.py --durations 0'
      - 'uv run --no-sync pytest -x -vvs -n 8 -k "warm_up_false" tests/optimum/v1/sample/test_sampler.py --durations 0'
      - 'uv run --no-sync pytest -x -vvs -n 8 -k "not warm_up_true and not warm_up_false" tests/optimum/v1/sample/test_sampler.py tests/optimum/v1/sample/test_sampler_bucket.py --durations 0'

  # ===========================================================================
  # Optimum smoke suites -> NPU using RSD
  # ===========================================================================
  - label: ":pytest: tests/optimum/optimum_compile/smoke rsd-1"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    env:
      # TODO single-threaded OpenMP works around a libgomp fork-safety deadlock in the
      # rsd-1 smoke suite -> a pooling test's parent-side matmul warms libgomp, then the next
      # forked EngineCore inherits a phantom-worker pool and hangs in GOMP_parallel while
      # loading the compiled model.
      OMP_NUM_THREADS: "1"
    resources:
      npu:
        count: 1
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/optimum_compile/smoke/test_rsd1.py --durations 0"

  - label: ":pytest: tests/optimum/optimum_compile/smoke rsd-4"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources:
      npu:
        count: 4
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/optimum_compile/smoke/test_rsd4.py --durations 0"

  - label: ":pytest: tests/optimum/optimum_compile/smoke rsd-8"
    if_changed: *if_changed
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources:
      npu:
        count: 8
        product: ["RBLN-CA22", "RBLN-CA25"]
    secrets: *secrets
    depends_on: *needs_venv
    command:
      - "uv run --no-sync pytest -x -vvs tests/optimum/optimum_compile/smoke/test_rsd8.py --durations 0"
