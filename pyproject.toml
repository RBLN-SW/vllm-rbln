[build-system]
# Should be mirrored in requirements/build.txt
requires = [
    "cmake>=3.26",
    "ninja",
    "packaging",
    "setuptools>=61",
    "setuptools-scm>=8.0",
    "wheel",
    "jinja2",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm_rbln"
authors = [{name = "Rebellions Inc.", email = "support@rebellions.ai"}]
license = { "file"= "LICENSE" }
readme = "README.md"
description = "vLLM plugin for RBLN NPU"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10,<3.14"
dynamic = ["version"]
dependencies = [
    "setuptools>=64",
    "setuptools-scm>=8",
    "pyyaml",
    "datasets>=4.0.0",
    "qwen_vl_utils",
    "vllm==0.24.0+cpu",
    "fastapi[standard]<0.137",
    "torch",
    "torchvision",
    "torchaudio",
    "torchcodec",
    "torch-rbln~=0.4.0rc0 ; platform_machine == 'x86_64'",
    "optimum-rbln>=0.11.2a1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "pytest-timeout",
    "arctic-inference==0.1.1",
]
build = [
    "build",
    "setuptools-scm",
]
dev = [
    "packaging",
    "simphile",
    "pynvml",
    "huggingface_hub",
    "fire",
]

runtime = [
    "rebel-compiler~=0.11.3.dev4",
]


[project.urls]
Homepage="https://rebellions.ai"
Documentation="https://docs.rbln.ai"
Repository="https://github.com/rbln-sw/vllm-rbln"

[project.entry-points."vllm.platform_plugins"]
rbln = "vllm_rbln:register"

[project.entry-points."vllm.general_plugins"]
rbln_new_models = "vllm_rbln:register_model"
rbln_custom_ops = "vllm_rbln:register_ops"

[tool.setuptools_scm]
version_file = "vllm_rbln/_version.py"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["benchmarks", "csrc", "docs", "examples", "tests*"]
namespaces = false

[tool.pytest.ini_options]
# Reject unregistered markers. A typo'd mark is silently inert otherwise, which
# is exactly how an expensive test leaks into the lane that runs on every PR.
addopts = ["--strict-markers"]
markers = [
    "model_compile: compiles a whole model on the NPU; minutes per test. Skipped unless --model-compile is passed. Tests that compile only an individual op are deliberately left unmarked so they stay in the default lane.",
    "use_device: always touches the NPU (e.g. compiles an op via the rbln backend) regardless of --device-tensor, so it is always auto-spawned in a fresh process -- never run in the parent, which would pin the device for the rest of the session.",
    "maybe_use_device: opens the RBLN device only when device tensors are on. Auto-spawned in a fresh process under --device-tensor 1 (never in the parent, which would pin the device for the rest of the session); runs in-process under --device-tensor 0 (cpu).",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # Can remove once 3.10+ is the minimum Python version
    "UP007",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[tool.uv]
# 0.11.25 changed lockfile serialization (redundant `environments` markers factored
# out into `supported-markers`, astral-sh/uv#19933); older uv re-locking writes them
# all back inline, producing a ~900-line noise diff. Gate every uv command on >= 0.11.25.
required-version = ">=0.11.25"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
# pypi.rebellions.in is intentionally NOT registered: packages appear/disappear
# there independently of dev/main, so a full lock refresh could pin versions that
# must not be used. Install packages from it ad-hoc via --extra-index-url instead
# (see DEVELOPMENT.md).
# Exact reproduction is uv.lock's job — installs without the lock are out of contract.
index-strategy = "unsafe-best-match"
prerelease = "if-necessary-or-explicit"   # pin uv's default explicitly — prereleases only for packages with a marker (or prerelease-only packages)

[[tool.uv.index]]
name = "vllm-cpu"
url = "https://wheels.vllm.ai/0.24.0/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "rbln-nexus-nightly"
url = "https://nexus.mgmt.rbln.in/repository/pypi-group-nightly/simple/"

[[tool.uv.index]]
name = "rbln-release"
url = "https://pypi.rbln.ai/simple/"

[tool.uv.sources]
vllm = { index = "vllm-cpu" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[tool.typos.default]
binary = false
check-filename = false
check-file = true
unicode = true
ignore-hex = true
identifier-leading-digits = false
locale = "en"
extend-ignore-identifiers-re = ["NVML_*", ".*Unc.*", ".*_thw",
    ".*UE8M0.*", ".*[UE4M3|ue4m3].*", ".*eles.*",
     ".*[Tt]h[rR].*"]
extend-ignore-words-re = []
extend-ignore-re = []
