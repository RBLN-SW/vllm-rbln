name: CI / Trigger internal test

on:
  workflow_call:
    inputs:
      ref:
        description: "ref to checkout"
        required: false
        type: string
      pr_number:
        description: "PR number to checkout (optional)"
        required: false
        type: string
      rebel_compiler_version:
        description: "(optional) override rebel-compiler — empty = version from uv.lock"
        required: false
        type: string
      optimum_rbln_version:
        description: "Version of optimum-rbln to use (optional)"
        required: false
        type: string

jobs:
  build-vllm-rbln:
    name: Build vllm-rbln wheel (packaging check)
    runs-on: rbln-sw-k8s-general
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0 # setuptools_scm needs tags to compute the version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel (fails if packaging is broken)
        # `python -m build` installs the [build-system].requires (setuptools_scm
        # etc.) into an isolated env, so only `build` itself is needed here.
        run: |
          python -m pip install build
          python -m build --wheel

