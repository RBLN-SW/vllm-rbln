name: Backport merged pull request

on:
  # pull_request reads this file from the pull request's merge commit, so it takes
  # effect on dev without waiting for a dev -> main sync. pull_request_target would
  # also cover forks, but it only triggers from the default branch, and backports
  # here are limited to maintainer pull requests opened from in-repo branches.
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport pull request
    runs-on: rbln-sw-k8s-general
    if: >
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create backport pull requests
        uses: korthout/backport-action@v4
        with:
          # The default GITHUB_TOKEN cannot open pull requests here: the
          # repository has "Allow GitHub Actions to create and approve pull
          # requests" disabled. Pull requests it opened would also not trigger
          # CI. Use the PAT the other workflows already use.
          github_token: ${{ secrets.GIT_PAT }}
          label_pattern: '^backport ([^ ]+)$'
          copy_labels_pattern: '.*'
          conflict_resolution: draft_commit_conflicts
          # The default title is prefixed with "[Backport <branch>]", which fails
          # the conventional-commit check in pr_title_check.yaml. Keep the original
          # title so the check passes and the squashed commit on the release branch
          # reads the same as it does on dev.
          pull_title: '${pull_title}'
          pull_description: |-
            # Description
            Backport of #${pull_number} to `${target_branch}`, originally by @${pull_author}.
