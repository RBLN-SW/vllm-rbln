name: Backport merged pull request

on:
  # TEMP: production must use pull_request_target on the default branch.
  # pull_request runs from the base branch, which is what lets this be tested
  # on a throwaway branch without touching main.
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport pull request
    runs-on: rbln-sw-k8s-general
    if: >
      github.event.pull_request.merged &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create backport pull requests
        uses: korthout/backport-action@v4
        with:
          # The default GITHUB_TOKEN cannot open pull requests in this repository
          # (Actions "create and approve pull requests" is disabled), and PRs it
          # opens would not trigger CI. Use the PAT the other workflows already use.
          github_token: ${{ secrets.GIT_PAT }}
          label_pattern: '^backport ([^ ]+)$'
          copy_labels_pattern: '.*'
          conflict_resolution: draft_commit_conflicts
