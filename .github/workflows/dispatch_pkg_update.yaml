name: Dispatch / Pkg Update
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version to use
        default: "3.12"
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      optimum-version:
        description: Version of optimum-rbln to add
        default: "latest"
        type: string  

  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        default: "3.12"
        type: string
      optimum-version:
        description: Version of optimum-rbln to add
        default: "latest"
        type: string
    secrets:
      UDC_NEXUS_USERNAME:
        required: false
      UDC_NEXUS_PASSWORD:
        required: false
      GIT_PAT:
        required: false

jobs:
  update-pkg:
    uses: ./.github/workflows/pkg_update.yaml
    secrets:
      UDC_NEXUS_USERNAME: ${{ secrets.UDC_NEXUS_USERNAME }}
      UDC_NEXUS_PASSWORD: ${{ secrets.UDC_NEXUS_PASSWORD }}
      GIT_PAT: ${{ secrets.GIT_PAT }}
    with:
      python-version: ${{ inputs.python-version }}
      optimum-version: ${{ inputs.optimum-version }}
