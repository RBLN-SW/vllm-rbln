name: CI / PR / vllm-rbln with optimum

# vllm-rbln compiles every model itself, on the runner, through vLLM's
# optimum-rbln path: a single LLM(model=<hf-id>, ...) call compiles AND runs
# inference in one shot. There is no dependency on an externally pre-compiled
# model directory (the old REBEL_VLLM_PRE_COMPILED_DIR), so this workflow no
# longer waits on a separate nightly/tag compile pipeline.
#
# To keep compile+run fast enough for every PR, each step points at a TINY
# checkpoint (hf-internal-testing / trl-internal-testing randoms, or the
# genuinely-small pooling models). Output of the random tiny models is
# meaningless, so those steps are smoke tests: success == compile + inference
# finish without error. The small pooling models (embedding / bge) keep a
# self-contained accuracy assertion (--assert_ranking) instead.
#
# One job per RSD runner class.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ref to checkout"
        required: false
        type: string
      pr_number:
        description: "PR number to checkout (optional)"
        required: false
        type: string
      rebel_compiler_version:
        description: "Version of rebel-compiler to use (optional, defaults to uv.lock pin)"
        required: false
        type: string
      optimum_rbln_version:
        description: "Version of optimum-rbln to use (optional)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "ref to checkout"
        required: false
        type: string
      pr_number:
        description: "PR number to checkout (optional)"
        required: false
        type: string
      rebel_compiler_version:
        description: "Version of rebel-compiler to use"
        required: false
        type: string
      optimum_rbln_version:
        description: "Version of optimum-rbln to use (optional)"
        required: false
        type: string

jobs:
  # ===========================================================================
  # RSD 1 — small pooling/encoder/decoder models kept full-size with a real accuracy
  #         check.
  # ===========================================================================
  test_vllm_rbln_rsd1:
    name: Optimum Smoke CI RSD 1
    runs-on: rbln-sw-k8s-ca22-1
    container:
      image: mcr.microsoft.com/devcontainers/python:3.12
    defaults:
      run:
        shell: bash
    env:
      NUM_INPUT_PROMPT: 1
      VLLM_LOGGING_LEVEL: DEBUG
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Shared HF cache mount so models are downloaded once across runners.
      HF_HOME: ${{ secrets.HF_HOME }}
    steps:
      - name: Install uv CLI
        run: |
          pip install uv

      - name: Install build-essential
        run: |
          for i in {1..3}; do
            apt-get update && break || sleep 10
          done
          apt-get install -y build-essential

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Fix git ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create test environment via uv sync
        uses: nick-fields/retry@v3
        env:
          UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: ${{ secrets.UDC_NEXUS_USERNAME }}
          UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: ${{ secrets.UDC_NEXUS_PASSWORD }}
          UV_INDEX_REBELLIONS_USERNAME: ${{ secrets.REBEL_PYPI_USERNAME }}
          UV_INDEX_REBELLIONS_PASSWORD: ${{ secrets.REBEL_PYPI_PASSWORD }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: any
          shell: bash
          command: |
            if [ -z "$UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME" ] || [ -z "$UV_INDEX_REBELLIONS_USERNAME" ]; then
              echo "::error::UDC_NEXUS_USERNAME/PASSWORD and REBEL_PYPI_USERNAME/PASSWORD secrets not available to this repo — add repo/org secrets (LDAP account)"
              exit 1
            fi
            uv sync --locked --python 3.12 --extra test --extra dev --extra runtime
            # rebel-compiler version override (escape hatch)
            if [ -n "${{ inputs.rebel_compiler_version }}" ]; then
              uv pip install --no-deps "rebel-compiler==${{ inputs.rebel_compiler_version }}" --extra-index-url "${{ secrets.DEV_PKG_URL }}"
            fi
            # optimum-rbln version override (escape hatch)
            if [ -n "${{ inputs.optimum_rbln_version }}" ]; then
              uv pip install --no-deps "optimum-rbln==${{ inputs.optimum_rbln_version }}"
            fi

      - name: Run optimum smoke tests (RSD 1)
        run: >
          uv run --no-sync pytest tests/optimum/optimum_compile/smoke/test_rsd1.py
          -v --durations 0

