name: vllm-rbln / PR

on:
  pull_request:
    branches:
      - dev
      - dev-0.24.0

jobs:
  # [skip ci] is honored natively by both GitHub Actions (push / pull_request
  # runs) and the Obedients pipeline (GitHub settings), so no explicit skip job.
  trigger-internal-tests:
    uses: ./.github/workflows/rbln_trigger_internal_test.yaml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}
