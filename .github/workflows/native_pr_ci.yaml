name: vllm-rbln / Native / PR

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "vllm-rbln ref to test (branch, tag, or SHA)"
        required: false
        type: string

concurrency:
  group: native-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch native CI to fsw-integration
    if: github.repository_owner == 'RBLN-SW'
    runs-on: fsw-r18s-atom-ext-rbln-sw-general-c1m12
    steps:
      - name: Dispatch to fsw-integration
        uses: Wandalen/wretry.action@v3
        with:
          action: peter-evans/repository-dispatch@v4
          attempt_limit: 5
          attempt_delay: 2000
          with: |
            token: ${{ secrets.GIT_PAT }}
            repository: rebellions-sw/fsw-integration
            event-type: vllm-rbln-native-pr-event
            client-payload: |
              {
                "ref": "${{ github.event.pull_request.head.ref || inputs.ref }}",
                "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
                "pr_number": "${{ github.event.number }}",
                "actor": "${{ github.actor }}"
              }
