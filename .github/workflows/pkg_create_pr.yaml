name: Pkg Create PR for vllm-rbln
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: true
        type: string
      optimum-version:
        description: "Optimum version to update"
        required: true
        type: string

jobs:
  create-pr:
    runs-on: rbln-sw-k8s-general
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install packaging library for comparing against the declared range
        run: pip install packaging

      - name: Update Optimum Version in uv
        id: uv-update-optimum-rbln
        env:
          UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: ${{ secrets.UDC_NEXUS_USERNAME }}
          UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: ${{ secrets.UDC_NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.optimum-version }}"
          VERSION="${VERSION#v}"

          # The declared range already admits most new releases, and in that case
          # only uv.lock has to move. Raising the floor on every alpha narrows the
          # range for everyone downstream and buys nothing: the lock is what pins
          # the version we actually resolve to.
          IN_RANGE=$(python - "${VERSION}" <<'PY'
          import pathlib, re, sys
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'"optimum-rbln([^"]*)"', text)
          if match is None:
              sys.exit("optimum-rbln is not declared in pyproject.toml")
          spec = SpecifierSet(match.group(1))
          print("yes" if spec.contains(Version(sys.argv[1]), prereleases=True) else "no")
          PY
          )

          if [ "${IN_RANGE}" = "yes" ]; then
            echo "${VERSION} satisfies the declared range; refreshing uv.lock only"
            UPDATE=(uv lock --upgrade-package "optimum-rbln==${VERSION}")
          else
            # Outside the declared range, so the range itself has to move with it.
            CEILING=$(python -c 'import re, sys; m = re.match(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1]) or sys.exit(f"cannot derive a patch-line ceiling from {sys.argv[1]!r}"); print(f"{m[1]}.{m[2]}.{int(m[3]) + 1}")' "${VERSION}")
            echo "${VERSION} falls outside the declared range; widening it to >=${VERSION},<${CEILING}"
            UPDATE=(uv add "optimum-rbln>=${VERSION},<${CEILING}" --upgrade-package optimum-rbln)
          fi

          for i in {1..6}; do
            "${UPDATE[@]}" && exit 0
            sleep 10
          done
          echo "::error::${UPDATE[0]} failed after retries"
          exit 1

      - name: Create PR for updated files
        id: create-pr-step
        if: ${{ steps.uv-update-optimum-rbln.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GIT_PAT }}
          add-paths: |
            pyproject.toml
            uv.lock
          commit-message: "other: update optimum-rbln to ${{ inputs.optimum-version }}"
          title: "other: auto-update optimum-rbln to ${{ inputs.optimum-version }}"
          body: "Updated optimum-rbln to ${{ inputs.optimum-version }}."
          branch: auto-update-optimum-rbln-${{ inputs.optimum-version }}
          base: dev
          reviewers: |
            rebel-jonghewk
            rebel-eunji
            rebel-seinpark
            rebel-junamsong
    outputs:
      success: ${{ steps.create-pr-step.outputs.pull-request-operation != 'none' }}
