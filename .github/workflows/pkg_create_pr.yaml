name: Pkg Create PR for vllm-rbln
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: true
        type: string
      optimum-version:
        description: "Optimum version to update"
        required: true
        type: string

jobs:
  create-pr:
    runs-on: rbln-sw-k8s-general
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
      - name: Update Optimum Version in uv
        id: uv-update-optimum-rbln
        env:
          UV_INDEX_RBLN_NEXUS_NIGHTLY_USERNAME: ${{ secrets.UDC_NEXUS_USERNAME }}
          UV_INDEX_RBLN_NEXUS_NIGHTLY_PASSWORD: ${{ secrets.UDC_NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.optimum-version }}"
          VERSION="${VERSION#v}"

          # Bump optimum-rbln in pyproject.toml and refresh uv.lock in one step.
          for i in {1..6}; do
            uv add "optimum-rbln>=${VERSION}" --upgrade-package optimum-rbln && exit 0
            sleep 10
          done
          echo "::error::uv add failed after retries"
          exit 1

      - name: Create PR for updated files
        id: create-pr-step
        if: ${{ steps.uv-update-optimum-rbln.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GIT_PAT }}
          add-paths: |
            pyproject.toml
            uv.lock
          commit-message: "other: update optimum-rbln to ${{ inputs.optimum-version }}"
          title: "other: auto-update optimum-rbln to ${{ inputs.optimum-version }}"
          body: "Updated optimum-rbln to ${{ inputs.optimum-version }}."
          branch: auto-update-optimum-rbln-${{ inputs.optimum-version }}
          base: dev
          reviewers: |
            rebel-jonghewk
            rebel-eunji
            rebel-seinpark
            rebel-junamsong
    outputs:
      success: ${{ steps.create-pr-step.outputs.pull-request-operation != 'none' }}
