name: vllm-rbln / PR

on:
  pull_request_review:
    types: [submitted]

jobs:
  build-vllm-rbln-wheel:
    name: Build vllm-rbln wheel (packaging check)
    if: ${{ github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'dev' }}
    runs-on: rbln-sw-k8s-general
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # setuptools_scm needs tags to compute the version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel (fails if packaging is broken)
        run: |
          python -m pip install build
          python -m build --wheel
